// Addon-Projekt für Kieselstein ERP (Basiskit)
//
// Gebaut wird gegen die Schnittstellen der Kieselstein-Version auf dem Server:
// Die Erweiterung legt die Client-Bibliotheken beim Anlegen nach .kieselstein-client/lib.
// Anders mit -PksClientLib=/pfad/zur/lib.
ext {
    ksClientLib = findProperty('ksClientLib') ?: "${rootDir}/.kieselstein-client/lib"
    kieselsteinApi = files(fileTree(ksClientLib) { include 'kieselstein-ejb-*.jar', 'kieselstein-common-*.jar' })
    basiskitVersion = '@BASISKIT_VERSION@'
}

subprojects {
    apply plugin: 'java'
    group = 'kieselstein.addon'
    version = '0.1.0'
    repositories { mavenCentral() }
    java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-proc:none']
    }
}
